name: Publish installer updates to Tencent COS

on:
  workflow_dispatch:
    inputs:
      channel:
        description: Release channel
        type: choice
        default: test
        options: [test, stable, validate]
  repository_dispatch:
    types: [quanwang-release-verified]
  schedule:
    - cron: '11,41 * * * *'
  push:
    branches: [main]
    paths: ['.github/workflows/publish-cos.yml', 'scripts/publish-cos.cjs']

permissions:
  contents: read
  id-token: write

concurrency:
  group: quanwang-cos-publisher
  cancel-in-progress: false

jobs:
  publish:
    if: github.repository == 'q209046391/quanwang-release' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Install pinned publisher dependencies
        run: npm install --no-save --package-lock=false --ignore-scripts cos-nodejs-sdk-v5@3.0.0 js-yaml@4.1.1
      - name: Validate or publish the selected release
        env:
          GH_TOKEN: ${{ github.token }}
          COS_ROLE_ARN: ${{ vars.COS_ROLE_ARN }}
          COS_PUBLISH_MODE: ${{ github.event_name == 'push' && (vars.COS_ROLE_ARN != '' && 'test' || 'validate') || inputs.channel || 'stable' }}
        run: node scripts/publish-cos.cjs

